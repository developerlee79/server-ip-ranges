name: Publish range data

# Range data is never committed. This job fetches every provider feed, packs the lookup
# tables, and attaches them to a dated release, which is what IPRangeData.useRelease()
# downloads. Azure publishes weekly, so weekly is as often as this is worth running.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 in October 2026, and an unattended weekly
    # job is the worst place to discover a runner image change.
    runs-on: ubuntu-24.04

    steps:
      # Pinned to commit SHAs rather than tags: a tag can be moved to point at other code,
      # and this job holds a token that can publish releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git; leaving the token in .git/config would only widen
          # what a later step could read.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch provider feeds
        run: ./gradlew updateRangeFiles

      # Lets the packer refuse to publish a provider whose block count collapsed, which is
      # what a truncated upstream feed looks like.
      - name: Download previous manifest
        run: |
          curl -fsSL -o previous-version.json \
            "https://github.com/${{ github.repository }}/releases/latest/download/version.json" \
            || echo "no previous release yet"

      - name: Pack release assets
        run: ./gradlew packReleaseData -PpreviousVersionJson=previous-version.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('build/release-data/version.json'))['version'])")

          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" build/release-data/* --clobber
          else
            gh release create "v$version" build/release-data/* \
              --title "Range data $version" \
              --notes "Packed cloud provider IP range tables. Consumed by IPRangeData.useRelease()."
          fi
